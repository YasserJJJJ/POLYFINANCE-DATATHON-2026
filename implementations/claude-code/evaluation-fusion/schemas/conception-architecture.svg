<text x="1228" y="228" text-anchor="start" font-size="11" fill="#333">restitution, question</text>
<text x="850" y="438" text-anchor="middle" font-size="10" fill="#8a3b12">verdict</text>
<rect x="245.8" y="270" width="180.5" height="16" fill="#ffffff"/>
<text x="336" y="281" text-anchor="middle" font-size="11" fill="#8a3b12">hypothèse du parent en cause</text>
<rect x="569.6" y="261" width="112.7" height="16" fill="#ffffff"/>
<text x="626" y="272" text-anchor="middle" font-size="11" fill="#8a3b12">méthode manquante</text>
<rect x="906.7" y="247" width="106.6" height="16" fill="#ffffff"/>
<text x="960" y="258" text-anchor="middle" font-size="11" fill="#8a3b12">source contestée</text>
<rect x="553.6" y="232" width="272.9" height="16" fill="#ffffff"/>
<text x="690" y="243" text-anchor="middle" font-size="11" fill="#8a3b12">précision, correction, changement, variante</text>
<text x="166" y="262" text-anchor="start" font-size="10" fill="#555">question</text>
<text x="180" y="512" text-anchor="middle" font-size="11" fill="#2b5fb4" font-style="italic">fiche de qualification</text>
<text x="462" y="512" text-anchor="middle" font-size="11" fill="#2b5fb4" font-style="italic">dossier de preuves · plan des méthodes</text>
<text x="734" y="512" text-anchor="middle" font-size="11" fill="#2b5fb4" font-style="italic">plan scellé · note d'analyse</text>
<text x="961" y="512" text-anchor="middle" font-size="11" fill="#2b5fb4" font-style="italic">objections, en un lot</text>
<text x="1220" y="512" text-anchor="middle" font-size="11" fill="#2b5fb4" font-style="italic">restitution · questions</text>
<text x="700" y="884" text-anchor="middle" font-size="11" fill="#555">Le catalogue porte les décisions prises d'avance ; le greffier, les portes et les calculs le lisent ; seule l'équipe le modifie.</text>
<text x="1373" y="344" text-anchor="middle" font-size="10" fill="#555">appels</text>
<text x="1373" y="372" text-anchor="middle" font-size="9" fill="#555">(cadres</text>
<text x="1373" y="383" text-anchor="middle" font-size="9" fill="#555">bleus)</text>
<text x="1373" y="660" text-anchor="middle" font-size="10" fill="#8a3b12">miroir</text>
<rect x="999.8" y="483" width="180.5" height="16" fill="#ffffff"/>
<text x="1090" y="494" text-anchor="middle" font-size="11" fill="#8a3b12">recherche pendant la demande</text>
<text x="146" y="946" text-anchor="start" font-size="12" fill="#333">parcours principal d'une étude</text>
<text x="146" y="968" text-anchor="start" font-size="12" fill="#333">approfondissement ou retour : une question est rouverte chez un autre rôle</text>
<text x="146" y="988" text-anchor="start" font-size="12" fill="#333">coordination : contrôle, rangement, remise des pièces</text>
<text x="664" y="924" text-anchor="start" font-size="11" fill="#333">agent ou spécialiste : un modèle sur Amazon Bedrock</text>
<text x="664" y="940" text-anchor="start" font-size="11" fill="#333">code, sans modèle</text>
<text x="664" y="956" text-anchor="start" font-size="11" fill="#333">personnes</text>
<text x="664" y="972" text-anchor="start" font-size="11" fill="#333">ce qui est conservé</text>
<text x="664" y="988" text-anchor="start" font-size="11" fill="#333">service AWS</text>
