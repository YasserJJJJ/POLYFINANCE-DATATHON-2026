<text x="640" y="145" text-anchor="middle" font-size="11" fill="#333">demande, réponses</text>
<text x="880" y="145" text-anchor="middle" font-size="11" fill="#333">affichages</text>
<text x="222" y="228" text-anchor="end" font-size="11" fill="#333">demande</text>
