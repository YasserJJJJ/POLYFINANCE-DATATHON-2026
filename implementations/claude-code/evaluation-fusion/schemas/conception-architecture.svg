<text x="180.0" y="368.8" text-anchor="middle" font-size="13" font-weight="400" fill="#10233f">Qualification et formalisation</text>
<text x="180.0" y="385.8" text-anchor="middle" font-size="13" font-weight="400" fill="#10233f"></text>
<text x="180.0" y="402.8" text-anchor="middle" font-size="13" font-weight="400" fill="#10233f">décision, profil, objectifs,</text>
<text x="180.0" y="419.8" text-anchor="middle" font-size="13" font-weight="400" fill="#10233f">inconnues, contradictions,</text>
<text x="180.0" y="436.8" text-anchor="middle" font-size="13" font-weight="400" fill="#10233f">questions</text>
<rect x="350" y="320" width="240" height="140" rx="10" fill="#eef4ff" stroke="#2b5fb4" stroke-width="1.5"/>
<text x="470.0" y="351.8" text-anchor="middle" font-size="13" font-weight="600" fill="#10233f">Agent 1</text>
<text x="470.0" y="368.8" text-anchor="middle" font-size="13" font-weight="400" fill="#10233f">Recherche critique</text>
<text x="470.0" y="385.8" text-anchor="middle" font-size="13" font-weight="400" fill="#10233f"></text>
<text x="470.0" y="402.8" text-anchor="middle" font-size="13" font-weight="400" fill="#10233f">preuves, conditions, contradictions,</text>
<text x="470.0" y="419.8" text-anchor="middle" font-size="13" font-weight="400" fill="#10233f">limites, plan des méthodes ;</text>
<text x="470.0" y="436.8" text-anchor="middle" font-size="13" font-weight="400" fill="#10233f">spécialiste : lecteur de document</text>
<rect x="635" y="306" width="420" height="186" rx="12" fill="#f7faff" stroke="#2b5fb4" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="845" y="484" text-anchor="middle" font-size="12" font-weight="600" fill="#2b5fb4">Responsabilité 2 — analyse, confrontation comprise</text>
<rect x="648" y="320" width="172" height="140" rx="10" fill="#eef4ff" stroke="#2b5fb4" stroke-width="1.5"/>
<text x="734.0" y="360.3" text-anchor="middle" font-size="13" font-weight="600" fill="#10233f">Agent 2</text>
<text x="734.0" y="377.3" text-anchor="middle" font-size="13" font-weight="400" fill="#10233f">Analyse et résolution</text>
<text x="734.0" y="394.3" text-anchor="middle" font-size="13" font-weight="400" fill="#10233f"></text>
<text x="734.0" y="411.3" text-anchor="middle" font-size="13" font-weight="400" fill="#10233f">options, plan scellé,</text>
<text x="734.0" y="428.3" text-anchor="middle" font-size="13" font-weight="400" fill="#10233f">conclusion typée</text>
<rect x="880" y="320" width="162" height="140" rx="10" fill="#eef4ff" stroke="#2b5fb4" stroke-width="1.5"/>
<text x="961.0" y="360.3" text-anchor="middle" font-size="13" font-weight="600" fill="#10233f">Contradicteur</text>
<text x="961.0" y="377.3" text-anchor="middle" font-size="13" font-weight="400" fill="#10233f">spécialiste, contexte neuf</text>
<text x="961.0" y="394.3" text-anchor="middle" font-size="13" font-weight="400" fill="#10233f"></text>
<text x="961.0" y="411.3" text-anchor="middle" font-size="13" font-weight="400" fill="#10233f">objections de la grille ;</text>
<text x="961.0" y="428.3" text-anchor="middle" font-size="13" font-weight="400" fill="#10233f">verdict par le code</text>
<rect x="1100" y="320" width="240" height="140" rx="10" fill="#eef4ff" stroke="#2b5fb4" stroke-width="1.5"/>
<text x="1220.0" y="360.3" text-anchor="middle" font-size="13" font-weight="600" fill="#10233f">Agent 3</text>
<text x="1220.0" y="377.3" text-anchor="middle" font-size="13" font-weight="400" fill="#10233f">Restitution et interaction</text>
<text x="1220.0" y="394.3" text-anchor="middle" font-size="13" font-weight="400" fill="#10233f"></text>
<text x="1220.0" y="411.3" text-anchor="middle" font-size="13" font-weight="400" fill="#10233f">trois profondeurs,</text>
<text x="1220.0" y="428.3" text-anchor="middle" font-size="13" font-weight="400" fill="#10233f">questions, réactions</text>
