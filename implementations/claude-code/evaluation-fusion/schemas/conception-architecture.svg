<rect width="1660" height="1010" fill="#ffffff"/>
<text x="60" y="34" font-size="18" font-weight="600" fill="#10233f">AlphaForge — architecture proposée</text>
<text x="60" y="54" font-size="12" fill="#555">Quatre agents autour d'un dossier de décision partagé et versionné · proposition du 15 novembre 2026, non construite</text>
<rect x="560" y="70" width="400" height="52" rx="10" fill="#fff6e5" stroke="#b07a12" stroke-width="1.5"/>
<text x="760.0" y="91.8" text-anchor="middle" font-size="13" font-weight="600" fill="#3d2c05">La personne</text>
<text x="760.0" y="108.8" text-anchor="middle" font-size="13" font-weight="400" fill="#3d2c05">demande, répond, corrige, signale un changement, explore une variante</text>
<rect x="60" y="160" width="1280" height="46" rx="10" fill="#f4f4f1" stroke="#6b6b63" stroke-width="1.5"/>
<text x="700.0" y="187.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1c1c1a">Interface (code) — parcours lisible · affichages enregistrés · trois gestes : « je me suis trompé », « ma situation a changé », « et si… »</text>
