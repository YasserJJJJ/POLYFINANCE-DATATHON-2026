<text x="1167.5" y="919.8" text-anchor="middle" font-size="13" font-weight="600" fill="#3d2c05">L'équipe, hors exécution</text>
<text x="1167.5" y="936.8" text-anchor="middle" font-size="13" font-weight="400" fill="#3d2c05">tient le catalogue, qualifie, relit</text>
<path d="M1167,900 L1167,858" fill="none" stroke="#6b6b63" stroke-width="1.3" marker-end="url(#ff)"/>
<rect x="1395" y="286" width="235" height="470" rx="12" fill="#fffaf7" stroke="#c0562a" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="1512" y="304" text-anchor="middle" font-size="12" font-weight="600" fill="#c0562a">Route AWS</text>
<rect x="1410" y="322" width="205" height="84" rx="10" fill="#fdf0ea" stroke="#c0562a" stroke-width="1.5"/>
<text x="1512.5" y="344.0" text-anchor="middle" font-size="12" font-weight="600" fill="#3f1b0c">Amazon Bedrock</text>
<text x="1512.5" y="360.0" text-anchor="middle" font-size="12" font-weight="400" fill="#3f1b0c">tous les appels de modèle : quatre</text>
<text x="1512.5" y="376.0" text-anchor="middle" font-size="12" font-weight="400" fill="#3f1b0c">agents, contradicteur, lecteur ;</text>
<text x="1512.5" y="392.0" text-anchor="middle" font-size="12" font-weight="400" fill="#3f1b0c">reclassement des fiches</text>
<rect x="1410" y="426" width="205" height="58" rx="10" fill="#fdf0ea" stroke="#c0562a" stroke-width="1.5"/>
<text x="1512.5" y="443.0" text-anchor="middle" font-size="12" font-weight="600" fill="#3f1b0c">CloudTrail et CloudWatch</text>
<text x="1512.5" y="459.0" text-anchor="middle" font-size="12" font-weight="400" fill="#3f1b0c">trace des appels de modèle,</text>
<text x="1512.5" y="475.0" text-anchor="middle" font-size="12" font-weight="400" fill="#3f1b0c">retrouvés par leur identifiant</text>
<rect x="1410" y="506" width="205" height="58" rx="10" fill="#fdf0ea" stroke="#c0562a" stroke-width="1.5"/>
<text x="1512.5" y="531.0" text-anchor="middle" font-size="12" font-weight="600" fill="#3f1b0c">AgentCore</text>
<text x="1512.5" y="547.0" text-anchor="middle" font-size="12" font-weight="400" fill="#3f1b0c">recherche web (agent 1)</text>
<rect x="1410" y="632" width="205" height="70" rx="10" fill="#fdf0ea" stroke="#c0562a" stroke-width="1.5"/>
<text x="1512.5" y="655.0" text-anchor="middle" font-size="12" font-weight="600" fill="#3f1b0c">S3 versionné</text>
<text x="1512.5" y="671.0" text-anchor="middle" font-size="12" font-weight="400" fill="#3f1b0c">miroir du dossier,</text>
<text x="1512.5" y="687.0" text-anchor="middle" font-size="12" font-weight="400" fill="#3f1b0c">sous accord du porteur</text>
