<rect x="60" y="540" width="1280" height="40" rx="10" fill="#f4f4f1" stroke="#6b6b63" stroke-width="1.5"/>
<text x="700.0" y="564.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1c1c1a">Portes (code) — chaque pièce d'un rôle est contrôlée contre son contrat avant d'entrer au dossier ; un refus garde son motif</text>
<path d="M180,518 L180,537" fill="none" stroke="#6b6b63" stroke-width="1.3" marker-end="url(#ff)"/>
<path d="M462,518 L462,537" fill="none" stroke="#6b6b63" stroke-width="1.3" marker-end="url(#ff)"/>
<path d="M734,518 L734,537" fill="none" stroke="#6b6b63" stroke-width="1.3" marker-end="url(#ff)"/>
<path d="M961,518 L961,537" fill="none" stroke="#6b6b63" stroke-width="1.3" marker-end="url(#ff)"/>
<path d="M1220,518 L1220,537" fill="none" stroke="#6b6b63" stroke-width="1.3" marker-end="url(#ff)"/>
<rect x="60" y="620" width="1280" height="96" rx="22" fill="#eaf7ef" stroke="#2f7d4f" stroke-width="1.5"/>
<text x="700.0" y="655.3" text-anchor="middle" font-size="13" font-weight="600" fill="#12331f">Dossier de décision</text>
<text x="700.0" y="672.3" text-anchor="middle" font-size="13" font-weight="400" fill="#12331f">pièces immuables identifiées par leur empreinte · journal en ajout seul · état en vigueur déduit · branches pour les variantes</text>
<text x="700.0" y="689.3" text-anchor="middle" font-size="13" font-weight="400" fill="#12331f">graphe de questions · graphe de preuves · graphe de tâches · états : refusée, en vigueur, remplacée, périmée, erronée · support : fichiers</text>
<path d="M700,580 L700,617" fill="none" stroke="#6b6b63" stroke-width="1.3" marker-end="url(#ff)"/>
<rect x="60" y="770" width="290" height="84" rx="10" fill="#f4f4f1" stroke="#6b6b63" stroke-width="1.5"/>
<text x="205.0" y="799.3" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1c1a">Greffier (code)</text>
<text x="205.0" y="816.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1c1c1a">tâches, versions, invalidations, reprise ;</text>
<text x="205.0" y="833.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1c1c1a">lance la batterie et le contradicteur</text>
<rect x="385" y="770" width="270" height="84" rx="10" fill="#f4f4f1" stroke="#6b6b63" stroke-width="1.5"/>
<text x="520.0" y="799.3" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1c1a">Calculs (code)</text>
<text x="520.0" y="816.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1c1c1a">formulations, batterie fixe, rendus,</text>
<text x="520.0" y="833.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1c1c1a">tests de condition, verdicts</text>
<rect x="690" y="770" width="270" height="84" rx="10" fill="#f4f4f1" stroke="#6b6b63" stroke-width="1.5"/>
<text x="825.0" y="799.3" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1c1a">Qualification des données (code)</text>
<text x="825.0" y="816.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1c1c1a">empreintes, fenêtre, conventions,</text>
<text x="825.0" y="833.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1c1c1a">limites</text>
<rect x="995" y="770" width="345" height="84" rx="10" fill="#eaf7ef" stroke="#2f7d4f" stroke-width="1.5"/>
<text x="1167.5" y="799.3" text-anchor="middle" font-size="13" font-weight="600" fill="#12331f">Catalogue versionné</text>
<text x="1167.5" y="816.3" text-anchor="middle" font-size="13" font-weight="400" fill="#12331f">les règles écrites d'avance : gabarits de décision,</text>
<text x="1167.5" y="833.3" text-anchor="middle" font-size="13" font-weight="400" fill="#12331f">formulations, seuils, grilles ; fiches qualifiées</text>
